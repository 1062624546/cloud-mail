
name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-mail-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main

          # 检查是否存在上游新提交
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"
            exit 0
          fi

          # 合并上游提交
          if ! git merge --no-commit --no-ff upstream/main; then
            echo "Merge conflicts detected"
          fi

          # 始终保留自己的同步工作流
          git checkout HEAD -- .github/workflows/sync.yml

          # 其他有冲突的文件需要人工处理
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git add -A
          git commit -m "同步上游最新代码"

          git push origin HEAD:main
